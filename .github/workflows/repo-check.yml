name: Repository checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f supabase/schema.sql
          test -f supabase/functions/analyze-evidence/index.ts
          test -f supabase/functions/ask-assistant/index.ts

      - name: Check frontend syntax
        run: node --check app.js

      - name: Check package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"
